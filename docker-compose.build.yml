  typebot-builder:
    build:
      context: .
      args:
        - SCOPE=builder
    # depends_on:
    #   typebot-db:
    #     condition: service_healthy
    restart: always
    ports:
      - "5000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    networks:
      typebot_typebot-network:
        ipv4_address: 172.22.0.4

  typebot-viewer:
    build:
      context: .
      args:
        - SCOPE=viewer
    # depends_on:
    #   typebot-db:
    #     condition: service_healthy
    restart: always
    ports:
      - "5001:3000"
    env_file: .env
    networks:
      typebot_typebot-network:
        ipv4_address: 172.22.0.5

networks:
  typebot_typebot-network:
    external: true
