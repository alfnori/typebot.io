version: "3.9"
services:
  typebot-builder:
    build:
      context: .
      dockerfile: Dockerfile.custom
      args:
        - SCOPE=builder
        - DATABASE_PROVIDER:${DATABASE_PROVIDER:-postgresql}
    restart: always
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env.custom
    networks:
      typebot_typebot-network:

  typebot-viewer:
    build:
      context: .
      dockerfile: Dockerfile.custom
      args:
        - SCOPE=viewer
    restart: always
    ports:
      - "3001:3000"
    env_file: .env.custom
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      typebot_typebot-network:

networks:
  typebot_typebot-network:
    external: true
